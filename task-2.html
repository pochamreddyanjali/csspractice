<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Element tag*/
        h1{
              color:red
        }
        /*id tag*/
        #id1{
            background-color: blue;
        }
        /*class tag*/
        .id2{
            background-color: green;
        }
        *{
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
    <p id="id1">This belongs to selector id</p>
    <p class="id2">This belongs to selector class1</p>
    <h1 class="id2">This belongs to selector class2</h1>
    <h1 class="id2">This belongs to selector class3</h1>
</body>
</html>
