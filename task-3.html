<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Element tag*/
        h2{
              color:red
        }
        /*id tag*/
        #mainHeader{
            background-color: blue;
        }
        /*class tag*/
        .eventCard{
            background-color: green;
        }
        /*Universal selector*/
        *{
            margin:20px;
            padding:30px;
        }
        /*Group Selector*/
        h3,p{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
    <h2>Welcome to practice sessions</h2>
    <h2>Loved to learn css</h2>
    <h3>play with learning</h3>
    <p id="mainHeader">This belongs to selector id</p>
    <p class="eventCard">This belongs to selector class1</p>
    <h1 class="eventCard">This belongs to selector class2</h1>
    <h1 class="eventCard">This belongs to selector class3</h1>
</body>
</html>
